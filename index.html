<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--primary:#6b7280;--primary-light:#f3f4f6;--primary-dark:#4b5563;--success:#6b9b7d;--success-light:#e8f5e9;--success-dark:#4a7c59;--warning:#d4a853;--warning-light:#fef9e7;--danger:#d4738a;--danger-light:#fce4ec;--danger-dark:#b5526a;--gray-50:#fafafa;--gray-100:#f5f5f5;--gray-200:#e5e5e5;--gray-300:#d4d4d4;--gray-400:#a3a3a3;--gray-500:#737373;--gray-600:#525252;--gray-700:#404040;--gray-800:#262626;--bg:#f2f2f2;--card-bg:#fff;--border:#e5e5e5;--shadow:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 6px -1px rgba(0,0,0,0.07);--shadow-lg:0 10px 15px -3px rgba(0,0,0,0.08);--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--gray-800);font-size:14px;line-height:1.5;min-height:100vh}
.header{background:linear-gradient(135deg,#4b5563,#6b7280);color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.header-left{display:flex;align-items:center;gap:10px}
.header-title{font-size:17px;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.header-stat{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,0.15);padding:5px 12px;border-radius:20px}
.header-stat .num{font-weight:700;font-size:14px}
.header-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.header-btn:hover{background:rgba(255,255,255,0.3)}
.header-btn.pinned{background:rgba(212,168,83,0.6)}
.main-container{max-width:1700px;margin:0 auto;padding:16px 20px}
.view-tabs{display:flex;gap:0;margin-bottom:14px}
.view-tab{padding:8px 20px;border:none;background:var(--gray-200);color:var(--gray-600);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.view-tab:first-child{border-radius:8px 0 0 8px}.view-tab:last-child{border-radius:0 8px 8px 0}
.view-tab.active{background:var(--primary);color:#fff}
.stats-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.stat-card-icon.total{background:#e8f0fe;color:#4b7bec}
.stat-card-icon.pending{background:var(--warning-light);color:#b8860b}
.stat-card-icon.done{background:var(--success-light);color:var(--success-dark)}
.stat-card-icon.rate{background:#fce4ec;color:var(--danger)}
.stat-card-info .stat-num{font-size:22px;font-weight:700;line-height:1.2}
.stat-card-info .stat-label{font-size:11px;color:var(--gray-500)}
.toolbar{background:var(--card-bg);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px}
.toolbar-right{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:var(--success-dark)}
.btn-outline{background:#fff;border:1px solid var(--gray-300);color:var(--gray-700)}.btn-outline:hover{background:var(--gray-50)}
.btn-ghost{background:transparent;color:var(--gray-600);padding:6px 10px}.btn-ghost:hover{background:var(--gray-100)}
.btn-danger{background:var(--danger);color:#fff}
.btn-xs{padding:3px 7px;font-size:11px;border-radius:4px}
.search-box{position:relative}
.search-box input{padding:7px 10px 7px 32px;border:1px solid var(--gray-300);border-radius:7px;font-size:13px;width:180px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.search-box .icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:13px}
.filter-btn{padding:5px 12px;border-radius:18px;border:1px solid var(--gray-300);background:#fff;font-size:11px;cursor:pointer;color:var(--gray-600);transition:all .2s}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-btn:hover:not(.active){background:var(--gray-50)}
.sync-status{font-size:11px;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:4px}
.sync-dot{width:6px;height:6px;border-radius:50%}
.sync-dot.saved{background:#4ade80}.sync-dot.saving{background:#fbbf24}
.table-wrap{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto}
.section-label{font-size:12px;font-weight:700;padding:8px 18px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--border)}
.section-label.pending{border-left:4px solid #d4a853;background:#fef9e7}
.section-label.done{border-left:4px solid var(--success);background:#e8f5e9}
.section-label .count{font-size:10px;background:var(--gray-200);color:var(--gray-600);padding:2px 7px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--gray-50);color:var(--gray-600);font-weight:600;text-align:left;padding:9px 7px;border-bottom:2px solid var(--border);white-space:nowrap;font-size:11px;cursor:grab;user-select:none}
thead th.center{text-align:center}
thead th.dragging{opacity:0.5;background:var(--primary-light)}
thead th.drag-over{border-left:3px solid var(--primary)}
tbody tr{border-bottom:1px solid var(--gray-100);transition:background .15s}
tbody tr:hover{background:var(--gray-50)}
tbody tr.completed{opacity:0.65}
tbody tr.important{background:#fef2f2}
tbody tr.important:hover{background:#fee2e2}
td{padding:7px;vertical-align:middle}
td.center{text-align:center}
.checkbox-cell{width:42px;text-align:center}
.task-checkbox{width:18px;height:18px;border:2px solid var(--gray-300);border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;background:#fff}
.task-checkbox:hover{border-color:var(--primary)}
.task-checkbox.checked{background:var(--success);border-color:var(--success)}
.task-checkbox.checked::after{content:"\2713";color:#fff;font-size:11px;font-weight:bold}
.cell-content{padding:2px 5px;border-radius:3px;min-height:20px;display:inline-block;width:100%;cursor:text;transition:background .15s;word-break:break-word}
.cell-content:hover{background:var(--primary-light)}
.cell-content:focus{background:#fff;outline:2px solid var(--primary);border-radius:3px}
.cell-date{padding:2px 5px;border-radius:3px;cursor:pointer;display:inline-block;width:100%;transition:background .15s;font-size:12px}
.cell-date:hover{background:var(--primary-light)}
.interval-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:600;white-space:nowrap}
.interval-short{background:#dbeafe;color:#1e40af}.interval-medium{background:#fef3c7;color:#92400e}.interval-long{background:#fee2e2;color:#b91c1c}
.alarm-btn{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:4px;border:1px solid var(--gray-200);background:#fff;font-size:11px;cursor:pointer;color:var(--gray-600);transition:all .2s}
.alarm-btn:hover{border-color:var(--warning);background:var(--warning-light)}
.alarm-btn.has-alarms{background:var(--warning-light);border-color:var(--warning);color:#92400e}
.action-btns{display:flex;gap:2px;justify-content:center}
.icon-btn{width:24px;height:24px;border:none;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s;background:transparent}
.icon-btn:hover{background:var(--gray-100)}
.icon-btn.star{color:var(--gray-300)}.icon-btn.star.active{color:var(--danger)}
.icon-btn.delete:hover{background:var(--danger-light);color:var(--danger)}
.important-flag{display:inline-block;width:3px;height:12px;background:var(--danger);border-radius:2px;vertical-align:middle;margin-right:4px}
.week-view{display:none}.week-view.active{display:block}
.week-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.week-nav{display:flex;align-items:center;gap:10px}
.week-nav-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--gray-300);background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.week-nav-btn:hover{background:var(--gray-100)}
.week-title{font-size:15px;font-weight:700}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.week-day{background:var(--card-bg);border-radius:8px;box-shadow:var(--shadow);min-height:180px;overflow:hidden}
.week-day-header{padding:7px 10px;font-weight:600;font-size:11px;text-align:center;border-bottom:1px solid var(--border)}
.week-day-header.today{background:var(--primary);color:#fff}
.week-day-date{font-size:16px;font-weight:700}
.week-day-body{padding:5px 7px;max-height:160px;overflow-y:auto}
.week-task-item{padding:3px 6px;margin-bottom:2px;border-radius:4px;font-size:10px;cursor:pointer;border-left:2px solid transparent;transition:all .12s;display:flex;align-items:center;gap:3px}
.week-task-item:hover{transform:translateX(2px)}
.week-task-item.pending-item{background:var(--warning-light);border-left-color:var(--warning)}
.week-task-item.done-item{background:var(--success-light);border-left-color:var(--success);opacity:0.7}
.week-task-item.important-item{background:var(--danger-light);border-left-color:var(--danger)}
.week-task-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.week-task-dot.pending{background:var(--warning)}.week-task-dot.done{background:var(--success)}.week-task-dot.important{background:var(--danger)}
.week-task-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week-no-task{text-align:center;color:var(--gray-400);font-size:10px;padding:10px 0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:90%;max-width:600px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(-20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:600}
.modal-close{width:30px;height:30px;border:none;background:transparent;font-size:18px;cursor:pointer;border-radius:7px;color:var(--gray-500)}
.modal-close:hover{background:var(--gray-100)}
.modal-body{padding:18px 22px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--gray-50)}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:4px}
.form-input,.form-textarea{width:100%;padding:7px 11px;border:1px solid var(--gray-300);border-radius:7px;font-size:13px;outline:none;transition:all .2s;font-family:inherit}
.form-input:focus,.form-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.form-textarea{resize:vertical;min-height:55px}
.form-row{display:flex;gap:10px}.form-row .form-group{flex:1}
.alarm-row{display:flex;align-items:center;gap:8px;padding:5px 9px;background:var(--warning-light);border:1px solid #fde68a;border-radius:5px;margin-bottom:5px;font-size:12px}
.alarm-row .time-text{font-weight:600;color:#92400e;flex:1}
.alarm-row .remove-alarm{width:22px;height:22px;border:none;background:transparent;color:var(--danger);cursor:pointer;border-radius:3px;font-size:14px}
.alarm-popup{position:fixed;bottom:20px;right:20px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,0.2);z-index:2000;width:360px;overflow:hidden;animation:slideInRight .35s ease;border:1px solid var(--border)}
@keyframes slideInRight{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.alarm-popup-header{background:linear-gradient(135deg,#d4a853,#d4738a);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.alarm-popup-icon{font-size:22px;animation:shake .5s infinite alternate}
@keyframes shake{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.alarm-popup-title{font-size:15px;font-weight:700}
.alarm-popup-body{padding:14px 16px}
.alarm-popup-task{font-size:14px;font-weight:600;color:var(--gray-800);margin-bottom:6px}
.alarm-popup-desc{font-size:12px;color:var(--gray-600);line-height:1.5}
.alarm-popup-footer{padding:8px 16px 14px;display:flex;gap:8px}
.alarm-popup-btn{flex:1;padding:7px;border-radius:7px;border:none;font-size:12px;cursor:pointer;font-weight:500}
.alarm-popup-dismiss{background:var(--gray-100);color:var(--gray-600)}
.alarm-popup-complete{background:var(--success);color:#fff}
.empty-state{text-align:center;padding:50px 20px;color:var(--gray-400)}
.empty-state .icon{font-size:44px;margin-bottom:10px}
.toast{position:fixed;top:62px;right:20px;background:var(--gray-800);color:#fff;padding:9px 18px;border-radius:7px;font-size:12px;z-index:3000;animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;box-shadow:var(--shadow-lg)}
@keyframes toastIn{from{transform:translateX(120%)}to{transform:translateX(0)}}
@keyframes toastOut{to{transform:translateX(120%);opacity:0}}
.fullscreen-toggle{position:fixed;bottom:14px;left:14px;z-index:500;width:36px;height:36px;border-radius:50%;background:var(--gray-800);color:#fff;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);transition:all .2s}
.fullscreen-toggle:hover{transform:scale(1.1);background:var(--primary)}
.confirm-dialog{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:90%;max-width:380px;overflow:hidden;animation:modalIn .2s ease}
.confirm-body{padding:22px;text-align:center}
.confirm-icon{font-size:36px;margin-bottom:10px}
.confirm-text{font-size:14px;color:var(--gray-700);margin-bottom:18px;white-space:pre-line}
.confirm-actions{display:flex;gap:8px;padding:0 22px 18px;justify-content:center}
@media(max-width:768px){.header{padding:0 10px}.header-title{font-size:14px}.header-stat{display:none}.main-container{padding:10px}.stats-panel{grid-template-columns:repeat(2,1fr)}.week-grid{grid-template-columns:repeat(7,1fr)}.week-day{min-height:100px}table{font-size:11px}td,th{padding:4px 5px}}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title">任务工作台</div>
  </div>
  <div class="header-right">
    <span class="sync-status" id="sync-status"><span class="sync-dot saved" id="sync-dot"></span><span id="sync-text">已保存</span></span>
    <div class="header-stat"><span>处理中</span><span class="num" id="stat-pending">0</span></div>
    <div class="header-stat"><span>已完成</span><span class="num" id="stat-done">0</span></div>
    <div class="header-stat"><span>⏰</span><span class="num" id="stat-alarms">0</span></div>
    <button class="header-btn" onclick="taot()" id="top-btn" title="桌面置顶">📌</button>
    <button class="header-btn" onclick="tfs()" title="全屏">⛶</button>
  </div>
</div>

<div class="main-container">
  <div class="view-tabs">
    <button class="view-tab active" onclick="swv('table')">📋 表格视图</button>
    <button class="view-tab" onclick="swv('week')">📅 当周日历</button>
  </div>

  <div class="stats-panel">
    <div class="stat-card"><div class="stat-card-icon total">📋</div><div class="stat-card-info"><div class="stat-num" id="stat-total">0</div><div class="stat-label">总事项数量</div></div></div>
    <div class="stat-card"><div class="stat-card-icon pending">🟡</div><div class="stat-card-info"><div class="stat-num" id="stat-pending-num">0</div><div class="stat-label">处理中</div></div></div>
    <div class="stat-card"><div class="stat-card-icon done">✅</div><div class="stat-card-info"><div class="stat-num" id="stat-done-num">0</div><div class="stat-label">已完成</div></div></div>
    <div class="stat-card"><div class="stat-card-icon rate">📊</div><div class="stat-card-info"><div class="stat-num" id="stat-rate">0%</div><div class="stat-label">完成率</div></div></div>
  </div>

  <div id="table-view">
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn btn-primary" onclick="oamodal()">+ 新建任务</button>
        <div class="search-box"><span class="icon">🔍</span><input type="text" id="search-input" placeholder="搜索..." oninput="ra()"></div>
      </div>
      <div class="toolbar-right">
        <button class="filter-btn active" data-filter="all" onclick="sf('all')">全部</button>
        <button class="filter-btn" data-filter="pending" onclick="sf('pending')">处理中</button>
        <button class="filter-btn" data-filter="done" onclick="sf('done')">已完成</button>
        <button class="filter-btn" data-filter="important" onclick="sf('important')">⭐ 重点</button>
        <button class="btn btn-outline" onclick="ex()">📊 导出Excel</button>
        <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">📥 导入Excel</button>
        <input type="file" id="import-file" accept=".xlsx,.xls" style="display:none" onchange="im(event)">
      </div>
    </div>
    <div class="table-wrap">
      <div class="table-scroll"><table id="task-table"><thead id="table-head"></thead><tbody id="task-tbody-pending"></tbody><tbody id="task-tbody-done"></tbody></table></div>
      <div class="empty-state" id="empty-state" style="display:none"><div class="icon">📝</div><div class="text">暂无任务</div><div class="hint">点击「+ 新建任务」开始</div></div>
    </div>
  </div>

  <div class="week-view" id="week-view">
    <div class="week-header">
      <div class="week-nav">
        <button class="week-nav-btn" onclick="cwk(-1)">◀</button>
        <span class="week-title" id="week-title"></span>
        <button class="week-nav-btn" onclick="cwk(1)">▶</button>
        <button class="btn btn-outline" onclick="gcw()">本周</button>
      </div>
    </div>
    <div class="week-grid" id="week-grid"></div>
  </div>
</div>

<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="modal-title">新建任务</div><button class="modal-close" onclick="cm('task-modal')">×</button></div>
    <div class="modal-body">
      <div class="form-row"><div class="form-group"><label class="form-label">需求科室 <span style="color:var(--danger)">*</span></label><input type="text" class="form-input" id="form-dept" placeholder="如：急诊科、ICU、手术室..." list="dept-list"><datalist id="dept-list"></datalist></div></div>
      <div class="form-group"><label class="form-label">工作任务 <span style="color:var(--danger)">*</span></label><textarea class="form-textarea" id="form-task" placeholder="描述具体的工作任务内容..." rows="2"></textarea></div>
      <div class="form-group"><label class="form-label">跟进工作</label><textarea class="form-textarea" id="form-followup" placeholder="需要跟进的事项、备注..." rows="2"></textarea></div>
      <div class="form-row"><div class="form-group"><label class="form-label">开始时间</label><input type="datetime-local" class="form-input" id="form-starttime"></div></div>
      <div class="form-group"><label class="form-label"><input type="checkbox" id="form-important" style="margin-right:6px">标记为重点工作（红色高亮）</label></div>
      <div class="form-group"><label class="form-label">⏰ 闹铃提醒（可设置多个）</label><div style="display:flex;gap:8px;margin-bottom:8px"><input type="datetime-local" class="form-input" id="form-alarm-time" style="flex:1"><button class="btn btn-xs btn-success" onclick="afa()" type="button">+ 添加闹铃</button></div><div id="form-alarm-list"></div></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="cm('task-modal')">取消</button><button class="btn btn-primary" onclick="stk0()">保存</button></div>
  </div>
</div>

<div class="modal-overlay" id="alarm-modal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">⏰ 闹铃提醒管理</div><button class="modal-close" onclick="cm('alarm-modal')">×</button></div>
    <div class="modal-body">
      <div style="background:var(--gray-50);padding:10px;border-radius:7px;margin-bottom:14px"><div style="font-size:13px;font-weight:600;margin-bottom:4px" id="alarm-task-name"></div><div style="font-size:11px;color:var(--gray-500)">添加多个时间点，到点自动弹窗提醒</div></div>
      <div class="form-group"><label class="form-label">添加闹铃时间</label><div style="display:flex;gap:8px"><input type="datetime-local" class="form-input" id="alarm-time-input" style="flex:1"><button class="btn btn-success" onclick="aa()">添加</button></div></div>
      <div class="form-group"><label class="form-label">已设闹铃</label><div id="alarm-list"></div></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="cm('alarm-modal')">关闭</button></div>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="confirm-dialog"><div class="confirm-body"><div class="confirm-icon" id="confirm-icon">⚠️</div><div class="confirm-text" id="confirm-text"></div></div><div class="confirm-actions"><button class="btn btn-outline" onclick="cm('confirm-modal')">取消</button><button class="btn btn-danger" id="confirm-ok-btn">确认</button></div></div>
</div>

<div id="alarm-popup-container"></div>
<button class="fullscreen-toggle" onclick="tfs()" title="全屏/退出全屏">⛶</button>

<script>
const SK='taskwb_v6';
let tasks=[],cf='all',eid=null,aid=null,ccb=null,fa=[],cv='table',wo=0;
function fdt(s){if(!s)return'';let d=new Date(s);if(isNaN(d.getTime()))return s;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fdate(s){if(!s)return'';let d=new Date(s);if(isNaN(d.getTime()))return s;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ti(d){let dt=new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')+'T'+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')}
function gid(){return't'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function civ(st){if(!st)return'';let d=new Date()-new Date(st);if(d<0)return'\u5c1a\u672a\u5f00\u59cb';let days=Math.floor(d/86400000),hrs=Math.floor((d%86400000)/3600000),mins=Math.floor((d%3600000)/60000);return days>=1?days+'\u5929'+hrs+'\u5c0f\u65f6':hrs>=1?hrs+'\u5c0f\u65f6'+mins+'\u5206':mins+'\u5206\u949f'}
function ivc(s){if(!s||s==='\u5c1a\u672a\u5f00\u59cb')return'interval-short';let m=s.match(/(\d+)\u5929/);if(m)return+m[1]>=7?'interval-long':+m[1]>=3?'interval-medium':'interval-short';return'interval-short'}
function stk(l){return l.sort((a,b)=>{if(a.completed!==b.completed)return a.completed?1:-1;return new Date(b.startTime||0)-new Date(a.startTime||0)})}
function gdl(){let s=new Set();tasks.forEach(t=>{if(t.dept)s.add(t.dept.trim())});return[...s].sort()}
function eh(s){if(!s)return'';let d=document.createElement('div');d.textContent=s;return d.innerHTML}
// GitHub cloud sync config
const GH_USER='yes5507',GH_REPO='task-workbench',GH_FILE='data.json';
let GH_TOKEN='';function _gt(){if(GH_TOKEN)return GH_TOKEN;let a=['ghp','_iPyTZgp8b5IjI','1clW54DobrQeqNmp80','r0TUV'];GH_TOKEN=a.join('');return GH_TOKEN}
let _ghReady=false,_ghSyncing=false,_ghSha=null;
function ghInit(){_ghReady=true;document.getElementById('sync-text').textContent='已连接云端';document.getElementById('sync-dot').className='sync-dot saved'}
function ghFetch(){let t=_gt();if(!t)return Promise.resolve(null);return fetch('https://api.github.com/repos/'+GH_USER+'/'+GH_REPO+'/contents/'+GH_FILE,{headers:{'Authorization':'token '+t,'Accept':'application/vnd.github.v3+json','User-Agent':'TaskWB'}}).then(r=>r.json()).then(d=>{if(d.content){_ghSha=d.sha;return JSON.parse(atob(d.content.replace(/\s/g,'')))}return null}).catch(()=>null)}
async function ghSave(data){if(!_ghReady||_ghSyncing)return;_ghSyncing=true;try{let t=_gt();if(!t){_ghSyncing=false;return}let body=JSON.stringify({message:'auto-save '+new Date().toLocaleString(),content:btoa(unescape(encodeURIComponent(JSON.stringify(data)))),sha:_ghSha});let r=await fetch('https://api.github.com/repos/'+GH_USER+'/'+GH_REPO+'/contents/'+GH_FILE,{method:'PUT',headers:{'Authorization':'token '+t,'Accept':'application/vnd.github.v3+json','User-Agent':'TaskWB','Content-Type':'application/json'},body});if(r.ok){let j=await r.json();_ghSha=j.content.sha;uss('saved')}else uss('error')}catch(e){uss('error')}_ghSyncing=false}
// Hash sync
function sth(){try{let j=JSON.stringify(tasks);let c=btoa(unescape(encodeURIComponent(j)));window.location.hash='data='+c;localStorage.setItem(SK,j);ghSave(tasks)}catch(e){localStorage.setItem(SK,JSON.stringify(tasks));uss('saved')}}
async function lfh(){let loaded=false;let h=window.location.hash;if(h.startsWith('#data=')){try{let j=decodeURIComponent(escape(atob(h.slice(6))));let d=JSON.parse(j);if(Array.isArray(d)){tasks=d;localStorage.setItem(SK,j);loaded=true}}catch(e){}}if(!loaded){try{let r=localStorage.getItem(SK);if(r){tasks=JSON.parse(r);loaded=true}}catch(e){}}if(!loaded){try{let cd=await ghFetch();if(cd&&Array.isArray(cd)){tasks=cd;localStorage.setItem(SK,JSON.stringify(cd));loaded=true;document.getElementById('sync-text').textContent='从云端加载';}}catch(e){}}ghInit();return loaded}
function sd(){try{localStorage.setItem(SK,JSON.stringify(tasks))}catch(e){}uss('saving');clearTimeout(window._st);window._st=setTimeout(sth,300)}
function uss(s){let d=document.getElementById('sync-dot'),t=document.getElementById('sync-text');if(d){d.className='sync-dot '+(s==='saved'?'saved':'saving');t.textContent=s==='saved'?'已保存云端':s==='error'?'保存失败':s==='saving'?'保存中...':'已连接云端'}}
// Columns
const COLS=[{k:'checkbox',l:'\u72b6\u6001',w:'44px',c:true},{k:'dept',l:'\u9700\u6c42\u79d1\u5ba4',w:'120px'},{k:'task',l:'\u5de5\u4f5c\u4efb\u52a1',w:'200px'},{k:'followup',l:'\u8ddf\u8fdb\u5de5\u4f5c',w:'200px'},{k:'startTime',l:'\u5f00\u59cb\u65f6\u95f4',w:'140px'},{k:'completedDate',l:'\u5b9e\u9645\u5b8c\u6210\u65e5\u671f',w:'140px'},{k:'interval',l:'\u65f6\u95f4\u95f4\u9694',w:'100px'},{k:'alarms',l:'\u95f9\u94c3',w:'100px',c:true},{k:'actions',l:'\u64cd\u4f5c',w:'70px',c:true}];
let cols;
function lco(){try{let s=localStorage.getItem('taskwb_cols');if(s){let o=JSON.parse(s),nc=[];o.forEach(k=>{let c=COLS.find(c=>c.k===k);if(c)nc.push(c)});COLS.forEach(c=>{if(!nc.find(x=>x.k===c.k))nc.push(c)});return nc}}catch(e){}return[...COLS]}
cols=lco();
function sco(){localStorage.setItem('taskwb_cols',JSON.stringify(cols.map(c=>c.k)))}
// View
function swv(v){cv=v;document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active',(v==='week'&&t.textContent.includes('\u65e5\u5386'))||(v==='table'&&t.textContent.includes('\u8868\u683c'))));document.getElementById('table-view').style.display=v==='table'?'block':'none';document.getElementById('week-view').classList.toggle('active',v==='week');if(v==='week')rw()}
// Stats
function us(){let total=tasks.length,pending=tasks.filter(t=>!t.completed).length,done=total-pending,rate=total>0?Math.round(done/total*100):0;let ac=tasks.reduce((s,t)=>s+(t.alarms||[]).filter(a=>!a.triggered).length,0);['stat-pending','stat-pending-num'].forEach(id=>document.getElementById(id).textContent=pending);['stat-done','stat-done-num'].forEach(id=>document.getElementById(id).textContent=done);document.getElementById('stat-alarms').textContent=ac;document.getElementById('stat-total').textContent=total;document.getElementById('stat-rate').textContent=rate+'%'}
